[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crucix-ingest"
version = "0.1.0"
description = "CRUCIX border-region news ingestion and baseline-analysis service"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "trafilatura>=1.12,<3",
  "news-please>=1.6,<2",
  "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
crucix-ingest = "crucix_ingest.__main__:main"

[tool.setuptools.packages.find]
include = ["crucix_ingest*"]

[tool.setuptools.package-data]
crucix_ingest = ["data/*.json"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# URL schemes are allow-listed (http/https only) before urlopen is reached.
"crucix_ingest/http_client.py" = ["S310"]
"crucix_ingest/nlp.py" = ["S310"]
# Feed XML is size-capped and rejected when it contains DOCTYPE/ENTITY declarations.
"crucix_ingest/feeds.py" = ["S314"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
