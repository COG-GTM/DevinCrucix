# Fly.io deployment for CRUCIX
# Deploy:  fly deploy
# Secrets: fly secrets set CRUCIX_PASSWORD=... CRUCIX_SESSION_SECRET=$(openssl rand -hex 32)
app = "crucix"
# OpenSky (opensky-network.org) is unreachable from Fly's iad egress (TCP connect
# timeouts); ewr/ord/ams reach it. Keep machines out of iad or the air layer
# silently falls back to ADS-B samples.
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3117"
  REFRESH_INTERVAL_MINUTES = "15"

[http_service]
  internal_port = 3117
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "60s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
